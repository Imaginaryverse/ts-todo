pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,ts,tsx,json,jsonc,md,yml,yaml,css}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{js,ts,tsx}"
      run: pnpm exec oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: pnpm tc
    - name: test
      run: pnpm test

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -1 {1} | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\(.+\))?!?: .+' \
          || { echo "Commit message must follow Conventional Commits, e.g. 'feat(api): add tasks endpoint'"; exit 1; }
