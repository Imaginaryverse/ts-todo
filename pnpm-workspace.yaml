saveExact: true
minimumReleaseAge: 1440

allowBuilds:
  lefthook: true
  esbuild: true
catalog:
  typescript: 7.0.2
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  drizzle-orm: 1.0.0-rc.5
  pg: 8.23.1
  zod: 4.6.7
  better-auth: 1.7.14
  hono: 4.13.14
  tsx: 4.23.15
  # These two are always released together, and need to stay on the same version
  vitest: 5.0.5
  "@vitest/browser-playwright": 5.0.5
  # So do these: the browsers Playwright installs are tied to its exact version
  playwright: 1.64.1
  "@playwright/test": 1.64.1

packages:
  - "apps/*"
  - "packages/*"
permissions:
  drizzle-kit:
    skills: false
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false
